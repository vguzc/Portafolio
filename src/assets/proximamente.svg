<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1.5" />
    </pattern>
  </defs>
  <!-- Fondo blanco limpio -->
  <rect width="800" height="500" fill="#ffffff" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Icono central minimalista -->
  <circle cx="400" cy="200" r="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <path d="M386 190 L400 204 L386 218" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="406" y1="218" x2="416" y2="218" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />

  <!-- Texto Próximamente -->
  <text x="400" y="280" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="6" fill="#0f172a" text-anchor="middle">PRÓXIMAMENTE</text>
  <text x="400" y="315" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#64748b" text-anchor="middle">PROYECTO EN DESARROLLO</text>
  
  <!-- Badge inferior estilo terminal -->
  <rect x="330" y="340" width="140" height="26" rx="13" fill="#f1f5f9" />
  <text x="400" y="357" font-family="monospace" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">// COMING SOON</text>
</svg>
